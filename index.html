<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Clearline Analytics turns your business files into clear decisions: forecasts, error checks and what-if tests for sales, marketing, accounting, people and market research. Encrypted, never shared." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Clearline Analytics · Clarity for every business decision</title>
    <meta property="og:title" content="Clearline Analytics" />
    <meta property="og:description" content="We turn your business files into clear decisions. Encrypted, never shared." />
    <meta property="og:type" content="website" />
    <script>
      document.documentElement.classList.add('js')
      try {
        document.documentElement.dataset.theme = localStorage.getItem('clearline:theme') === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
