<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Clearline is in its pilot phase: your first analysis is free. Send the files you already keep; we analyse them and a person checks every number." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Your first analysis is free · Clearline Analytics</title>
    <meta property="og:title" content="Clearline Analytics" />
    <meta property="og:description" content="Your first analysis is free while we're in our pilot phase. Encrypted, never shared." />
    <meta property="og:type" content="website" />
    <script>
      document.documentElement.classList.add('js')
      try {
        document.documentElement.dataset.theme = localStorage.getItem('clearline:theme') === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body data-page="pilot">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
